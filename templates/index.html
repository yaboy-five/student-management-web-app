{% extends "base.html" %}
{% block title %}Student Records — Home{% endblock %}
{% block content %}
  <section class="hero">
    <h1>Every student, on record.</h1>
    <p class="hero__lede">
      Add new enrolments, look up a student's course, or remove a record —
      all kept in sync with the registrar database.
    </p>
    <div class="hero__actions">
      <a href="{{ url_for('add_student') }}" class="btn btn--primary">Add a student</a>
      <a href="{{ url_for('view_students') }}" class="btn btn--ghost">View all records</a>
    </div>
  </section>
{% endblock %}
